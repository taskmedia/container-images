name: Docker

on:
  schedule:
    # run every biweekly
    - cron: '42 4 1,15 * *'

  push:
    branches: ["main"]

  pull_request:
    branches: ["main"]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.detect.outputs.images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine images to build
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          all_names=$(yq '.images[].name' .github/images.yml)

          build_all=false
          if [[ "$EVENT_NAME" == "schedule" || "$EVENT_NAME" == "workflow_dispatch" ]]; then
            build_all=true
          fi

          changed=""
          if [[ "$build_all" == "false" ]]; then
            if [[ -z "${BASE_SHA}" || "${BASE_SHA}" == "0000000000000000000000000000000000000000" ]]; then
              # No usable base (e.g. first push to a new branch) - build everything.
              build_all=true
            else
              changed=$(git diff --name-only "${BASE_SHA}" "${{ github.sha }}")
              # Changes to the workflow itself or the manifest affect every image.
              if echo "$changed" | grep -qE '^\.github/(workflows/docker\.yml|images\.yml)$'; then
                build_all=true
              fi
            fi
          fi

          if [[ "$build_all" == "true" ]]; then
            selected="$all_names"
          else
            selected=""
            while IFS= read -r name; do
              [[ -z "$name" ]] && continue
              if echo "$changed" | grep -q "^${name}/"; then
                selected="${selected}${name}"$'\n'
              fi
            done <<< "$all_names"
          fi

          json=$(printf '%s\n' "$selected" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "images=${json}" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: ${{ needs.detect.outputs.images != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJson(needs.detect.outputs.images) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      # This is used to complete the identity challenge
      # with sigstore/fulcio when running outside of PRs.
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Read image build config
        id: config
        run: |
          set -euo pipefail
          entry=$(yq -o=json ".images[] | select(.name == \"${{ matrix.image }}\")" .github/images.yml)
          context=$(echo "$entry" | jq -r '.context // "${{ matrix.image }}"')
          platforms=$(echo "$entry" | jq -r '.platforms | join(",")')
          echo "context=${context}" >> "$GITHUB_OUTPUT"
          echo "platforms=${platforms}" >> "$GITHUB_OUTPUT"

      # Install the cosign tool except on PR
      # https://github.com/sigstore/cosign-installer
      - name: Install cosign
        if: github.event_name != 'pull_request'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # Workaround: https://github.com/docker/build-push-action/issues/461
      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Login against a Docker registry except on PR
      # https://github.com/docker/login-action
      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Extract metadata (tags, labels) for Docker
      # https://github.com/docker/metadata-action
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/taskmedia/${{ matrix.image }}

      # Build and push Docker image with Buildx (don't push on PR)
      # https://github.com/docker/build-push-action
      - name: Build and push Docker image
        id: build-and-push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ steps.config.outputs.context }}
          platforms: ${{ steps.config.outputs.platforms }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.meta.outputs.tags }}
            ghcr.io/taskmedia/${{ matrix.image }}:latest
            fty4/${{ matrix.image }}:main
            fty4/${{ matrix.image }}:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

      # Sign the resulting Docker image digest except on PRs.
      # This will only write to the public Rekor transparency log when the Docker
      # repository is public to avoid leaking data.  If you would like to publish
      # transparency data even for private images, pass --force to cosign below.
      # https://github.com/sigstore/cosign
      - name: Sign the published Docker image
        if: ${{ github.event_name != 'pull_request' }}
        # This step uses the identity token to provision an ephemeral certificate
        # against the sigstore community Fulcio instance.
        run: |
          curl -s https://raw.githubusercontent.com/sigstore/root-signing/refs/heads/main/targets/signing_config.v0.2.json \
            | jq 'del(.rekorTlogUrls)' > /tmp/signing_config.json
          echo "${{ steps.meta.outputs.tags }}" | xargs -I {} cosign sign --yes --signing-config /tmp/signing_config.json {}@${{ steps.build-and-push.outputs.digest }}

      # Clean up legacy images from ghcr.io
      - uses: actions/delete-package-versions@v5
        if: github.event_name != 'pull_request'
        with:
          package-name: ${{ matrix.image }}
          package-type: 'container'
          min-versions-to-keep: 100
          delete-only-untagged-versions: 'true'

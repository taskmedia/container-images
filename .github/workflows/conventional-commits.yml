name: Conventional Commits

on:
  pull_request:
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check commits against conventional commits
        uses: taskmedia/action-conventional-commits@v1.3.1
        with:
          types: feat|fix|refactor|docs|test|chore|perf|ci
